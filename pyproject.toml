[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "si3d"
version = "0.1.0"
description = "Single-image 3D reconstruction: shared dataset loaders, evaluation and result tables"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "trimesh",
    "Pillow",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "open3d"]

[tool.setuptools.packages.find]
where = ["src"]
